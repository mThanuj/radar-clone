name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      # `prisma generate` reads prisma.config.ts, and src/lib/env.ts validates
      # the rest at import. Nothing here connects to anything: every page is
      # server-rendered on demand, so the build never queries or sends.
      DATABASE_URL: postgresql://user:pass@localhost:5432/placeholder
      DIRECT_URL: postgresql://user:pass@localhost:5432/placeholder
      BETTER_AUTH_SECRET: ci-placeholder-secret-16-chars
      BETTER_AUTH_URL: http://localhost:3000
      EMAIL_TRANSPORT: json
      SMTP_HOST: smtp.invalid
      SMTP_PORT: "587"
      SMTP_USER: ci@radar.local
      SMTP_PASS: placeholder
      SMTP_FROM: Radar CI <ci@radar.local>
      UPSTASH_REDIS_REST_URL: https://upstash.invalid
      UPSTASH_REDIS_REST_TOKEN: placeholder
      NEXT_TELEMETRY_DISABLED: "1"

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test

      - name: Build
        run: npx next build --webpack

  # Only runs once a database is configured in repo secrets. These tests write
  # to a real database, so point them at a scratch Neon branch — never at the
  # branch the app serves from.
  integration:
    runs-on: ubuntu-latest
    if: ${{ github.ref == 'refs/heads/main' && vars.RUN_INTEGRATION_TESTS == 'true' }}
    env:
      DATABASE_URL: ${{ secrets.TEST_DATABASE_URL }}
      DIRECT_URL: ${{ secrets.TEST_DIRECT_URL }}
      BETTER_AUTH_SECRET: ci-placeholder-secret-16-chars
      BETTER_AUTH_URL: http://localhost:3000
      # Placeholders: the suite forces EMAIL_TRANSPORT=json and never reaches
      # Upstash, so no real credentials are needed to run integration tests.
      EMAIL_TRANSPORT: json
      SMTP_HOST: smtp.invalid
      SMTP_PORT: "587"
      SMTP_USER: ci@radar.local
      SMTP_PASS: placeholder
      SMTP_FROM: Radar CI <ci@radar.local>
      UPSTASH_REDIS_REST_URL: https://upstash.invalid
      UPSTASH_REDIS_REST_TOKEN: placeholder

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Apply migrations
        run: npm run db:migrate

      - name: Integration tests
        run: npm run test:integration
