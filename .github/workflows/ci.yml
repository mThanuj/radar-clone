name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      # `prisma generate` reads prisma.config.ts, which requires these to be
      # resolvable. Nothing here connects to a database: every page is
      # server-rendered on demand, so the build never queries.
      DATABASE_URL: postgresql://user:pass@localhost:5432/placeholder
      DIRECT_URL: postgresql://user:pass@localhost:5432/placeholder
      BETTER_AUTH_SECRET: ci-placeholder-secret
      BETTER_AUTH_URL: http://localhost:3000
      NEXT_TELEMETRY_DISABLED: "1"

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test

      - name: Build
        run: npx next build --webpack

  # Only runs once a database is configured in repo secrets. These tests write
  # to a real database, so point them at a scratch Neon branch — never at the
  # branch the app serves from.
  integration:
    runs-on: ubuntu-latest
    if: ${{ github.ref == 'refs/heads/main' && vars.RUN_INTEGRATION_TESTS == 'true' }}
    env:
      DATABASE_URL: ${{ secrets.TEST_DATABASE_URL }}
      DIRECT_URL: ${{ secrets.TEST_DIRECT_URL }}
      BETTER_AUTH_SECRET: ci-placeholder-secret
      BETTER_AUTH_URL: http://localhost:3000

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Apply migrations
        run: npm run db:migrate

      - name: Integration tests
        run: npm run test:integration
